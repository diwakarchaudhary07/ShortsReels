{% extends "base.html" %} {% block content %}
<section class="py-4" style="max-width: 28rem">
  <h1 class="h2 mb-4">Login</h1>
  <form method="post">
    {% csrf_token %} {{ form.as_p }} {% if next %}<input
      type="hidden"
      name="next"
      value="{{ next }}"
    />{% endif %}
    <button class="btn btn-primary" type="submit">Login</button>
  </form>
</section>
{% endblock %}
